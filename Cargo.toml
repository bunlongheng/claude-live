[package]
name    = "claude-live"
version = "0.1.0"
edition = "2021"

[dependencies]
# Async runtime
tokio            = { version = "1",    features = ["full"] }

# HTTP + WebSocket server
axum             = { version = "0.7",  features = ["ws", "macros"] }
tower-http       = { version = "0.5",  features = ["cors"] }

# JSON
serde            = { version = "1",    features = ["derive"] }
serde_json       = "1"

# File watching — kqueue on macOS, zero-cost when idle
notify           = { version = "6",    features = ["macos_kqueue"] }

# TTY input injection (TIOCSTI ioctl)
libc             = "0.2"

# Utilities
anyhow           = "1"
tracing          = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono           = { version = "0.4",  features = ["serde"] }
dotenv           = "0.15"

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
strip         = true
